<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="An interactive reversal-learning lab using published fruit-fly anatomy and measured odor responses.">
  <title>FlyFlip Lab</title>
  <style>
    :root { color-scheme: light; --paper:#f5f2e9; --card:#fffdf6; --ink:#202f28; --muted:#546459; --border:#d9ded2; --dark:#15322a; --obs:#13765a; --ctrl:#a65321; --direct:#425d9d; --gold:#f0c477; font: 16px/1.65 system-ui, Tahoma, sans-serif; }
    * { box-sizing:border-box; }
    body { margin:0; color:var(--ink); background:var(--paper); }
    button, input, select { font:inherit; }
    button, select, input[type=range] { cursor:pointer; }
    a { color:inherit; text-underline-offset:.22em; }
    :focus-visible { outline:3px solid #937033; outline-offset:3px; }
    .wrap { width:min(1120px, calc(100% - 40px)); margin-inline:auto; }
    .mast { background:var(--dark); color:#f9f4e8; }
    .bar { display:flex; align-items:center; justify-content:space-between; gap:.8rem; padding-block:.75rem; border-bottom:1px solid #456054; }
    .brand { display:flex; direction:ltr; align-items:center; gap:.65rem; font-size:1.05rem; font-weight:750; letter-spacing:.04em; }
    .brand svg { flex:none; }
    nav { display:flex; gap:.9rem; align-items:center; font-size:.84rem; }
    nav a { text-decoration:none; }
    nav a:hover { text-decoration:underline; }
    nav button { color:var(--gold); border:1px solid #668076; background:none; padding:.18rem .62rem; border-radius:.4rem; }
    .hero { padding:1.45rem 0 1.65rem; display:grid; grid-template-columns:1fr auto; gap:1rem 2rem; align-items:center; }
    .kicker { margin:0; color:#45685a; font-size:.78rem; font-weight:750; letter-spacing:.06em; }
    .mast .kicker { color:var(--gold); }
    h1,h2,h3,p { margin:0; }
    h1 { font-size:clamp(1.85rem, 4.1vw, 3.5rem); line-height:1.19; margin:.27rem 0 .48rem; letter-spacing:-.02em; }
    [lang=en] h1 { font-family:Georgia,serif; }
    [lang=fa] h1 { letter-spacing:0; }
    .hero p:last-child { max-width:65ch; color:#e0eae2; font-size:.96rem; }
    .dataset { display:grid; grid-template-columns:repeat(2,minmax(6.6rem,1fr)); gap:.7rem; }
    .dataset > div { border-inline-start:1px solid #668076; padding-inline-start:.75rem; }
    .dataset strong { display:block; font-size:1.55rem; font-weight:720; line-height:1.1; color:var(--gold); }
    .dataset span { font-size:.78rem; color:#e0eae2; }
    main { padding-block:1.15rem 2.5rem; }
    section { margin-block:0 1rem; scroll-margin-top:.7rem; }
    .section-top { display:flex; align-items:flex-start; justify-content:space-between; gap:.6rem 1rem; margin-block-end:.63rem; }
    h2 { font-size:clamp(1.25rem, 2.5vw, 1.6rem); line-height:1.35; }
    h3 { font-size:.98rem; }
    .sub { color:var(--muted); font-size:.84rem; }
    .badge { white-space:nowrap; border-radius:2rem; padding:.18rem .7rem; background:#e4eee4; color:#244e3c; font-size:.74rem; font-weight:700; }
    .panel { background:var(--card); border:1px solid var(--border); border-radius:.8rem; padding:1rem; min-width:0; }
    .lab-grid { display:grid; grid-template-columns:minmax(235px, .78fr) minmax(0, 2fr); gap:.8rem; }
    .fields { display:grid; align-content:start; gap:.55rem; }
    .fields label { display:block; font-size:.81rem; font-weight:650; }
    .fields select, .fields input { width:100%; border:1px solid #b4c1b4; border-radius:.35rem; color:var(--ink); padding:.28rem .5rem; background:#fffef9; }
    select.odor, #seed { direction:ltr; text-align:left; }
    .order-seed { display:grid; grid-template-columns:1.25fr .75fr; gap:.55rem; }
    .run,.tool { border:1px solid #275144; border-radius:.38rem; font-weight:650; font-size:.84rem; padding:.38rem .68rem; }
    .run { background:var(--dark); color:#fffdf6; margin-block-start:.1rem; }
    .run:hover { background:#245545; }
    .tool { color:#244e3c; background:#f3f7ee; }
    .tool:hover { background:#e2edde; }
    .message { color:#8b391f; font-size:.8rem; font-weight:650; }
    .result-head { display:flex; flex-wrap:wrap; gap:.22rem .7rem; align-items:baseline; justify-content:space-between; }
    .metrics { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:.65rem; margin-block:.55rem; }
    .metric { border-block-start:3px solid var(--series); padding:.4rem .15rem .05rem; }
    .metric strong { display:block; font-size:clamp(1.22rem, 2.6vw, 1.65rem); line-height:1.2; color:var(--series); }
    .metric span { font-size:.76rem; }
    .plot { display:block; width:100%; height:auto; direction:ltr; }
    .timeline { display:flex; gap:.55rem; align-items:center; flex-wrap:wrap; margin-block:.75rem .5rem; }
    .timeline label { font-weight:650; font-size:.81rem; }
    input[type=range] { flex:1 1 8rem; max-width:24rem; min-width:5rem; accent-color:var(--obs); direction:ltr; }
    .tracks { display:grid; grid-template-columns:1fr 1fr; gap:.6rem; }
    .track { border:1px solid var(--border); border-radius:.5rem; padding:.55rem .65rem; font-size:.82rem; }
    .track h3 { margin-block-end:.18rem; color:var(--series); font-size:.87rem; }
    .track p { overflow-wrap:anywhere; }
    .outcome { display:inline-block; color:#214c36; background:#e5efe4; font-size:.73rem; font-weight:700; padding:0 .4rem; border-radius:.2rem; margin-block-start:.25rem; }
    .miss { color:#7c4025; background:#f8e9db; }
    .bench-layout { display:grid; grid-template-columns:minmax(0, 1.7fr) minmax(215px, .85fr); gap:1rem; align-items:start; }
    .finding { background:#e9eee2; border-inline-start:4px solid var(--obs); border-radius:.25rem; padding:.7rem .8rem; }
    .finding strong { display:block; font-size:1.08rem; line-height:1.4; }
    .finding p { margin-block-start:.35rem; font-size:.87rem; }
    .table-wrap { overflow-x:auto; margin-block:.8rem .3rem; }
    table { width:100%; border-collapse:collapse; font-size:.84rem; text-align:start; }
    th,td { padding:.43rem .55rem; text-align:start; border-block-end:1px solid var(--border); }
    thead th { background:#ecefe6; }
    details p, details ul { font-size:.88rem; margin-block:.55rem 0; }
    summary { font-weight:700; cursor:pointer; }
    footer { color:var(--muted); font-size:.79rem; padding-block:.1rem 1.4rem; }
    [hidden] { display:none !important; }
    @media (max-width:750px) { .hero,.lab-grid,.bench-layout { grid-template-columns:1fr; } .dataset { display:flex; flex-wrap:wrap; } .dataset > div { min-width:7rem; } }
    @media (max-width:440px) { .wrap { width:calc(100% - 24px); } nav { gap:.45rem; } nav a:first-child { display:none; } .panel { padding:.72rem; } .section-top { flex-wrap:wrap; } .metrics { gap:.35rem; } .tracks { grid-template-columns:1fr; } }
  </style>
</head>

      state = (state + 0x6D2B79F5) >>> 0;
      let value = Math.imul(state ^ state >>> 15, state | 1);
      value ^= value + Math.imul(value ^ value >>> 7, value | 61);
      random[i] = (value ^ value >>> 14) >>> 0;
    }
    return {episodes, trials, random};
  }

  function simulate(kernel, [a, b], initial, protocol, schedule) {
    const {episodes, trials, random} = schedule;
    const gram = [[kernel[a][a], kernel[a][b]], [kernel[b][a], kernel[b][b]]];
    const scores = [new Float64Array(episodes), new Float64Array(episodes)];
    const accuracy = new Array(trials);
    const sample = [];
    for (let trial = 0; trial < trials; trial++) {
      const flipped = Number(trial >= protocol.phase_trials);
      let hits = 0;
      for (let episode = 0; episode < episodes; episode++) {
        const target = initial ^ Number(episode >= protocol.replicates) ^ flipped;
        const offset = 2 * (trial * episodes + episode);
        const explore = random[offset] / 4294967296 < protocol.exploration;
        const tied = Math.abs(scores[0][episode] - scores[1][episode]) <= 1e-12;
        const choice = explore || tied ? (random[offset + 1] >>> 31) : Number(scores[1][episode] > scores[0][episode]);
        const reward = Number(choice === target);
        const step = protocol.learning_rate * (reward - scores[choice][episode]);
        scores[0][episode] += step * gram[0][choice];
        scores[1][episode] += step * gram[1][choice];
        hits += reward;
        if (episode === 0) sample.push({target, choice, reward});
      }
      accuracy[trial] = hits / episodes;
    }
    return {accuracy, sample};
  }

  function run(data, pair, initial, seed) {
    const {protocol, kernels} = data;
    if (pair.length !== 2 || pair[0] === pair[1] || pair.some(i => !Number.isInteger(i) || i < 0 || i >= kernels.observed.length)) {
      throw new RangeError('Choose two different measured odors');
    }
    if (![0, 1].includes(initial) || !Number.isInteger(seed) || seed < 0 || seed > 0xffffffff) {
      throw new RangeError('Invalid reward order or seed');
    }
    const schedule = plan(protocol, seed);
    const observed = simulate(kernels.observed, pair, initial, protocol, schedule);
    const direct = simulate(kernels.direct, pair, initial, protocol, schedule);
    const controls = kernels.controls.map(kernel => simulate(kernel, pair, initial, protocol, schedule));
    const rewired = controls[0].accuracy.map((_, trial) =>
      controls.reduce((sum, control) => sum + control.accuracy[trial], 0) / controls.length
    );
    return {pair, initial, seed, episodes: schedule.episodes,
      curves: {observed: observed.accuracy, rewired, direct: direct.accuracy},
      tracks: {observed: observed.sample, rewired: controls[0].sample}};
  }

  const api = {plan, simulate, run};
  if (typeof module === 'object' && module.exports) module.exports = api;
  else root.FlyFlipModel = api;
}(typeof globalThis === 'object' ? globalThis : this));

      footer: 'FlyFlip Lab · آزمایش پژوهشی قابل اجرا در مرورگر · اتصالات و پاسخ‌های منتشرشده، تصمیم‌ها و پاداش‌های شبیه‌سازی‌شده',

      navLab: 'Experiment', navStudy: 'Study results', kicker: 'Interactive learning lab',

      switchAt: n => `Reward switches at trial ${n}`, plotLabel: 'Percentage of correct choices by trial for three model conditions',
      methods: 'Methods, settings and sources', methodBody: 'The FAFB circuit table supplies edges and DoOR 2.0 supplies measured odor responses. Receptor responses serve as a proxy for circuit input. The panel uses complete measurements. Rewiring preserves each neuron’s connection count. Choices and rewards are simulation outputs.',
      settings: (channels, neurons, cells, lr, exploration, cutoff) => `${channels} odor channels, ${neurons} projection neurons, ${cells} Kenyon cells. Learning rate ${lr}, exploration probability ${exploration}, target active fraction ${cutoff}.`,
      sourceNames: ['FAFB connectivity table and paper', 'DoOR 2.0 response matrix documentation'],
      footer: 'FlyFlip Lab · A browser experiment with published connections, measured responses and simulated choices',
    },
  };

  const series = ['observed', 'rewired', 'direct'];
  const benchmarkCurves = Object.fromEntries(series.map(key => [key, benchmark[key].trial_accuracy]));
  const colors = {observed: 'var(--obs)', rewired: 'var(--ctrl)', direct: 'var(--direct)', chance: 'var(--muted)'};
  const switchTrial = protocol.phase_trials + 1;
  const odors = panel.odors.map(item => item.name);
  let language = 'fa';
  let result;
  const t = key => words[language][key];
  const number = value => new Intl.NumberFormat(language === 'fa' ? 'fa-IR' : 'en-US').format(value);
  const percent = value => new Intl.NumberFormat(language === 'fa' ? 'fa-IR' : 'en-US', {
    style: 'percent', minimumFractionDigits: 2, maximumFractionDigits: 2,
  }).format(value);

  function element(tag, text, className) {
    const node = document.createElement(tag);
    node.textContent = text;
    if (className) node.className = className;
    return node;
  }

  function svg(plot, name, attrs, text) {
    const node = document.createElementNS('http://www.w3.org/2000/svg', name);
    for (const [key, value] of Object.entries(attrs)) node.setAttribute(key, value);
    if (text) node.textContent = text;
    plot.append(node);
    return node;
  }

  function drawPlot(id, curves, trial) {
    const plot = get(id);
    const last = curves.observed.length;
    const width = Math.max(260, Math.min(660, plot.clientWidth || 660));
    const right = width - 18;
    const x = i => 46 + (i - 1) * (right - 46) / (last - 1);
    const y = v => 143 - v * 117;
    const label = {fill:'#546459', 'font-size':12};
    plot.replaceChildren();
    plot.setAttribute('viewBox', `0 0 ${width} 169`);
    plot.setAttribute('aria-label', t('plotLabel'));
    svg(plot, 'title', {}, t('plotLabel'));
    for (const value of [0, .5, 1]) {
      svg(plot, 'line', {x1:46,x2:right,y1:y(value),y2:y(value),stroke:'#d1d9cd','stroke-dasharray':value === .5 ? '4 4' : 'none'});
      svg(plot, 'text', {x:40,y:y(value) + 4,'text-anchor':'end',...label}, `${number(value * 100)}%`);
    }
    svg(plot, 'line', {x1:x(switchTrial),x2:x(switchTrial),y1:23,y2:143,stroke:'#875830','stroke-dasharray':'4 4'});
    svg(plot, 'text', {x:x(switchTrial),y:15,'text-anchor':'middle',...label,fill:'#7c482c'}, t('switchAt')(number(switchTrial)));
    for (const key of ['direct', 'observed', 'rewired']) {
      svg(plot, 'polyline', {points:curves[key].map((v, i) => `${x(i + 1)},${y(v)}`).join(' '),
        fill:'none',stroke:colors[key],'stroke-width':key === 'rewired' ? 1.8 : 2.4,'stroke-linejoin':'round',
        'stroke-dasharray':key === 'rewired' ? '5 3' : 'none'});
    }
    if (trial) {
      svg(plot, 'line', {x1:x(trial),x2:x(trial),y1:26,y2:143,stroke:'#68776a',opacity:.65});
      for (const key of series) svg(plot, 'circle', {cx:x(trial),cy:y(curves[key][trial - 1]),r:3.7,fill:colors[key],stroke:'#fffdf6'});
    }
    svg(plot, 'text', {x:46,y:162,...label}, `${t('trial')} ${number(1)}`);
    svg(plot, 'text', {x:right,y:162,'text-anchor':'end',...label}, `${t('trial')} ${number(last)}`);
  }

  function renderMetrics(id, values) {
    get(id).replaceChildren(...series.map(key => {
      const item = element('div', '', 'metric');
      item.style.setProperty('--series', colors[key]);
      item.append(element('strong', percent(values[key])), element('span', t(key)));
      return item;
    }));
  }

  function renderTracks() {
    const trial = Number(get('trial').value);
    const last = result.curves.observed.length;
    get('trial-label').textContent = t('trialLabel')(number(trial), number(last), trial >= switchTrial);
    get('tracks').replaceChildren(...['observed', 'rewired'].map(key => {
      const item = element('div', '', 'track');
      item.style.setProperty('--series', colors[key]);
      const sample = result.tracks[key][trial - 1];
      item.append(element('h3', t(key === 'rewired' ? 'control1' : key)));
      for (const [name, route] of [['target', sample.target], ['choice', sample.choice]]) {
        const line = element('p', `${t(name)} · `);
        const odor = element('bdi', odors[result.pair[route]]);
        odor.lang = 'en';
        line.append(odor);
        item.append(line);
      }
      item.append(element('span', t(sample.reward ? 'reward' : 'miss'), sample.reward ? 'outcome' : 'outcome miss'));
      return item;
    }));
    drawPlot('lab-plot', result.curves, trial);
  }

  function renderRun() {
    const start = protocol.phase_trials;
    const width = protocol.early_trials;
    const early = Object.fromEntries(series.map(key => [key, result.curves[key].slice(start, start + width)
      .reduce((sum, value) => sum + value, 0) / width]));
    renderMetrics('lab-metrics', early);
    get('run-status').textContent = t('runStatus')(number(result.episodes));
    renderTracks();
  }

  function renderBenchmark() {
    get('study-count').textContent = t('studyCount')(...[benchmark.pairs, benchmark.episodes, protocol.rewires].map(number));
    get('control-range').textContent = t('controlRange')(...benchmark.control_range.map(percent));
    renderMetrics('study-metrics', Object.fromEntries(series.map(key => [key, benchmark[key].first_after_switch])));
    drawPlot('study-plot', benchmarkCurves);
    get('study-table').replaceChildren(...[...series, 'chance'].map(key => {
      const row = element('tr', '');
      const header = element('th', t(key));
      header.scope = 'row';
      row.append(header, ...['late_before_switch', 'first_after_switch', 'late_after_switch']
        .map(metric => element('td', percent(benchmark[key][metric]))));
      return row;
    }));
  }

  function translate() {
    document.documentElement.lang = language;
    document.documentElement.dir = language === 'fa' ? 'rtl' : 'ltr';
    for (const node of document.querySelectorAll('[data-i]')) node.textContent = t(node.dataset.i);
    const toggle = get('language');
    toggle.lang = language === 'fa' ? 'en' : 'fa';
    toggle.textContent = language === 'fa' ? 'English' : 'فارسی';
    get('odor-count').textContent = number(odors.length);
    get('edge-count').textContent = number(panel.edges);
    get('run-note').textContent = t('runNote');
    get('error').textContent = t('error');
    get('settings').textContent = t('settings')(...[panel.channels, panel.projection_neurons, panel.kenyon_cells,
      protocol.learning_rate, protocol.exploration, protocol.active_fraction].map(number));
    get('sources').replaceChildren(...[
      'https://pmc.ncbi.nlm.nih.gov/articles/PMC9413950/',
      'https://docs.ropensci.org/DoOR.data/reference/door_response_matrix.html',
    ].map((url, i) => {
      const item = element('li', '');
      const link = element('a', t('sourceNames')[i]);
      link.href = url;
      item.append(link);
      return item;
    }));
    renderRun();
    renderBenchmark();
  }

  function run() {
    const pair = [Number(get('odor-a').value), Number(get('odor-b').value)];
    try {
      result = FlyFlipModel.run(data, pair, Number(get('initial').value), get('seed').valueAsNumber);
    } catch (error) {
      if (!(error instanceof RangeError)) throw error;
      get('error').hidden = false;
      return;
    }
    get('error').hidden = true;
    get('trial').max = result.curves.observed.length;
    get('trial').value = 1;
    renderRun();
  }

  ['odor-a', 'odor-b'].forEach((id, j) => {
    const sorted = odors.map((name, i) => [name, i]).sort(([a], [b]) => a.localeCompare(b, 'en'));
    get(id).replaceChildren(...sorted.map(([name, i]) => new Option(name, i)));
    get(id).value = data.initial_pair[j];
  });
  get('seed').value = protocol.seed;
  get('controls').addEventListener('submit', event => { event.preventDefault(); run(); });
  get('language').addEventListener('click', () => { language = language === 'fa' ? 'en' : 'fa'; translate(); });
  get('trial').addEventListener('input', renderTracks);
  get('jump').addEventListener('click', () => { get('trial').value = switchTrial; renderTracks(); });
  window.addEventListener('resize', () => {
    drawPlot('lab-plot', result.curves, Number(get('trial').value));
    drawPlot('study-plot', benchmarkCurves);
  });
  get('download').addEventListener('click', () => {
    const json = JSON.stringify({schema:'flyflip-browser-run-v1',
      benchmark_sha256:data.benchmark_sha256, protocol, sources:data.sources,
      odors:result.pair.map(i => panel.odors[i]), ...result}, null, 2);
    const url = URL.createObjectURL(new Blob([json], {type:'application/json'}));
    const link = element('a', '');
    link.href = url;
    link.download = `flyflip-run-${result.seed}.json`;
    link.click();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  });
  run();
  translate();
})();
